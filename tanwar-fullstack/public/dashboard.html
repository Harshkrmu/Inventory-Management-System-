<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#1B2438" />
<title>Inventory · Tanwar Collections</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231B2438'/%3E%3Cpath d='M8 9l4-2 4 2 4-2 4 2v14l-4 2-4-2-4 2-4-2z' fill='none' stroke='%23B98B3E' stroke-width='1.8'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css" />
</head>
<body data-protected data-page="dashboard">

<div class="app-shell">
  <nav class="sidebar" aria-label="Main">
    <div class="sidebar__brand">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#B98B3E" stroke-width="1.6" aria-hidden="true">
        <path d="M4 4l4-2 4 2 4-2 4 2v16l-4 2-4-2-4 2-4-2Z"/>
        <path d="M8 2v20M16 2v20"/>
      </svg>
      Tanwar
    </div>

    <a href="home.html" class="nav-link">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>
      Home
    </a>
    <a href="dashboard.html" class="nav-link active" aria-current="page">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>
      Inventory
    </a>

    <div class="sidebar__spacer"></div>

    <div class="sidebar__user">
      <strong data-user-name>—</strong>
      <span class="email" data-user-email></span>
      <button type="button" class="user-link" data-open-password>Change password</button>
      <a href="index.html" class="logout-link" data-logout>Log out</a>
    </div>
  </nav>
  <div class="sidebar-overlay" data-menu-close></div>

  <main class="main">
    <div class="topbar">
      <div class="topbar__lead">
        <button type="button" class="menu-btn" data-menu-toggle aria-label="Open menu"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
        <div class="topbar__title">
          <div class="kicker">Inventory</div>
          <h1>All products</h1>
        </div>
      </div>
      <div class="topbar__actions">
        <button type="button" class="btn btn-ghost btn-sm" id="export-csv">Export CSV</button>
        <button type="button" class="btn btn-gold btn-sm" id="open-add-modal">+ Add product</button>
      </div>
    </div>

    <div class="filters">
      <div class="searchbox">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#746E62" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.35-4.35"/></svg>
        <input type="text" id="inv-search" placeholder="Search name, SKU or color…" aria-label="Search products" />
      </div>
      <select id="inv-category-filter" aria-label="Filter by category">
        <option value="all">All categories</option>
        <option value="Men">Men</option>
        <option value="Women">Women</option>
        <option value="Kids">Kids</option>
        <option value="Unisex">Unisex</option>
      </select>
      <select id="inv-status-filter" aria-label="Filter by stock level">
        <option value="all">All stock levels</option>
        <option value="ok">In stock</option>
        <option value="low">Low stock</option>
        <option value="out">Out of stock</option>
      </select>
      <select id="inv-sort" aria-label="Sort products">
        <option value="newest">Newest first</option>
        <option value="name">Name A–Z</option>
        <option value="price_asc">Price: low to high</option>
        <option value="price_desc">Price: high to low</option>
        <option value="stock_asc">Stock: low to high</option>
        <option value="stock_desc">Stock: high to low</option>
      </select>
      <button type="button" class="btn btn-ghost btn-sm" id="clear-filters" hidden>Clear filters</button>
    </div>

    <div class="panel">
      <div class="panel__head">
        <h2 id="inv-heading"><span id="inv-count">0</span> products</h2>
      </div>
      <div class="table-wrap">
        <table class="inv-table">
          <thead>
            <tr>
              <th>Product</th>
              <th>Category</th>
              <th>Size / Color</th>
              <th>Price</th>
              <th>Stock</th>
              <th>Status</th>
              <th><span class="sr-only">Actions</span></th>
            </tr>
          </thead>
          <tbody id="inv-table-body"></tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<!-- Add / Edit product modal -->
<div class="modal-backdrop" id="product-modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="modal-title">
  <div class="modal">
    <div class="modal__head">
      <h2 id="modal-title">Add product</h2>
      <button type="button" class="modal__close" data-close-modal aria-label="Close">&times;</button>
    </div>
    <form id="product-form" novalidate>
      <div class="modal__body">
        <div class="field" style="margin-top:0;">
          <label for="p-name">Product name</label>
          <input type="text" id="p-name" name="name" placeholder="e.g. Men's Cotton Kurta" maxlength="150" />
        </div>
        <div class="field-row">
          <div class="field">
            <label for="p-category">Category</label>
            <select id="p-category" name="category">
              <option value="Men">Men</option>
              <option value="Women">Women</option>
              <option value="Kids">Kids</option>
              <option value="Unisex">Unisex</option>
            </select>
          </div>
          <div class="field">
            <label for="p-sku">SKU</label>
            <input type="text" id="p-sku" name="sku" placeholder="TC-MK-101" maxlength="60" />
          </div>
        </div>
        <div class="field-row">
          <div class="field">
            <label for="p-size">Size</label>
            <input type="text" id="p-size" name="size" placeholder="M / 32 / Free" maxlength="30" />
          </div>
          <div class="field">
            <label for="p-color">Color</label>
            <input type="text" id="p-color" name="color" placeholder="White" maxlength="40" />
          </div>
        </div>
        <div class="field-row">
          <div class="field">
            <label for="p-price">Price (₹)</label>
            <input type="number" id="p-price" name="price" min="0" step="0.01" inputmode="decimal" />
          </div>
          <div class="field">
            <label for="p-stock">Stock count</label>
            <input type="number" id="p-stock" name="stock" min="0" step="1" inputmode="numeric" />
          </div>
        </div>
        <div class="field">
          <label for="p-reorder">Reorder level</label>
          <input type="number" id="p-reorder" name="reorder" min="0" step="1" inputmode="numeric" placeholder="Alert when stock falls to this number" />
        </div>
        <div class="form-msg form-msg--error" id="product-msg" role="alert"></div>
      </div>
      <div class="modal__foot">
        <button type="button" class="btn btn-ghost btn-sm" data-close-modal>Cancel</button>
        <button type="submit" class="btn btn-gold btn-sm" id="product-save">Save product</button>
      </div>
    </form>
  </div>
</div>

<!-- Change password modal -->
<div class="modal-backdrop" id="pw-modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="pw-modal-title">
  <div class="modal modal--sm">
    <div class="modal__head">
      <h2 id="pw-modal-title">Change password</h2>
      <button type="button" class="modal__close" data-close-pw aria-label="Close">&times;</button>
    </div>
    <form id="pw-form" novalidate>
      <div class="modal__body">
        <div class="field" style="margin-top:0;">
          <label for="pw-current">Current password</label>
          <input type="password" id="pw-current" name="current" autocomplete="current-password" />
        </div>
        <div class="field">
          <label for="pw-new">New password</label>
          <input type="password" id="pw-new" name="next" autocomplete="new-password" placeholder="6+ characters" />
        </div>
        <div class="field">
          <label for="pw-confirm">Confirm new password</label>
          <input type="password" id="pw-confirm" name="confirm" autocomplete="new-password" />
        </div>
        <div class="form-msg form-msg--error" id="pw-msg" role="alert"></div>
      </div>
      <div class="modal__foot">
        <button type="button" class="btn btn-ghost btn-sm" data-close-pw>Cancel</button>
        <button type="submit" class="btn btn-gold btn-sm">Update password</button>
      </div>
    </form>
  </div>
</div>

<script src="js/common.js"></script>
<script src="js/inventory.js"></script>
</body>
</html>
