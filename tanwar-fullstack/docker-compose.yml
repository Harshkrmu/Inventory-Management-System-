# Runs the whole app with one command — no local MySQL install needed.
#
#   docker compose up --build
#
# Then open http://localhost:4000
#
# The database is created automatically on first run from db/schema.sql
# (MySQL's official image auto-runs any .sql file placed in
# /docker-entrypoint-initdb.d the very first time its data volume is empty).

services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-devpassword123}
      MYSQL_DATABASE: tanwar_collections
    volumes:
      - db_data:/var/lib/mysql
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_PASSWORD:-devpassword123}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${PORT:-4000}:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-devpassword123}
      DB_NAME: tanwar_collections
      JWT_SECRET: ${JWT_SECRET:-change_this_to_a_long_random_string}
      JWT_EXPIRES_IN: 7d
      CORS_ORIGIN: "*"

volumes:
  db_data:
